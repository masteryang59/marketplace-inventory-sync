<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Sync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Inventory Sync</h1>
      <p class="sub" id="subtitle">eBay ⇄ Shopify</p>
    </div>
    <div class="actions">
      <span class="pill" id="status-pill">loading…</span>
      <button id="sync-now">Sync now</button>
    </div>
  </header>

  <main>
    <section class="tiles">
      <div class="tile"><span class="label">SKUs synced</span><span class="value" id="t-skus">–</span></div>
      <div class="tile"><span class="label">Changed last run</span><span class="value" id="t-changed">–</span></div>
      <div class="tile"><span class="label">Failed writes</span><span class="value" id="t-failed">–</span></div>
      <div class="tile"><span class="label">Not on every channel</span><span class="value" id="t-unmatched">–</span></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Stock by SKU</h2>
        <span class="muted" id="last-run"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th class="num">eBay</th>
              <th class="num">Shopify</th>
              <th>Last run</th>
              <th>Result</th>
              <th class="demo-col" hidden>Demo</th>
            </tr>
          </thead>
          <tbody id="items"><tr><td colspan="6" class="muted">No sync has run yet.</td></tr></tbody>
        </table>
      </div>
      <ul class="unmatched" id="unmatched"></ul>
    </section>

    <section>
      <h2>Recent runs</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Run</th><th>Started</th><th>Trigger</th><th>Status</th><th class="num">Writes</th><th class="num">Failed</th><th class="num">Duration</th></tr>
          </thead>
          <tbody id="runs"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
<section id="backup_table"></section>
<section id="sync_records"></section>
